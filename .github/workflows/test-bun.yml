name: Bun Tests
# only one can run at a time
concurrency:
  # If PR, cancel prev commits. head_ref = source branch name on pull_request, null if push
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    # We intentionally don't run push on feature branches. See PR for rational.
    branches: [unstable, stable]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests-bun:
    name: Unit Tests (Bun)
    runs-on: buildjet-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bun uses the yarn lock file to install dependencies
      # We specify `--linker=hoisted` to mimic to default behavior of `yarn install` for Yarn 1
      - name: Install deps
        run: bun install --frozen-lock-file --linker=hoisted
      - name: Build
        run: bun run --bun build
      - name: Unit Tests
        # These packages are not testable yet in Bun because of `@chainsafe/blst` dependency.
        run: excluded=(beacon-node prover light-client cli); for pkg in packages/*/; do [[ ! " ${excluded[@]} " =~ " $(basename "$pkg") " ]] && echo "Testing $(basename "$pkg")" && (cd "$pkg" && bun run --bun test:unit); done
        shell: bash
